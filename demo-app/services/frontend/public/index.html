<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloodstream Shop</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Bloodstream Shop</h1>
    <span id="system-version" data-testid="system-version">v0</span>
  </header>
  <main>
    <section id="catalog" data-testid="catalog-section">
      <h2>Catalog</h2>
      <article class="product" data-testid="product-card">
        <h3>Verification Hoodie</h3>
        <p class="price" data-testid="product-price">$49</p>
        <button id="add-to-cart" data-testid="add-to-cart-btn">Add to cart</button>
      </article>
    </section>

    <section id="checkout-panel" data-testid="checkout-section" hidden>
      <h2>Checkout</h2>
      <form id="checkout-form" data-testid="checkout-form">
        <label>Email <input name="email" data-testid="checkout-email" value="user@bloodstream.io" /></label>
        <label>Password <input name="password" type="password" data-testid="checkout-password" value="demo-pass" /></label>
        <button type="button" id="login-btn" data-testid="login-btn">Sign in</button>
        <div id="auth-status" data-testid="auth-status"></div>
        <div id="payment-block" data-testid="payment-block" hidden>
          <p id="checkout-variant" data-testid="checkout-variant">standard</p>
          <button type="button" id="pay-btn" data-testid="pay-btn">Pay now</button>
        </div>
        <p id="order-result" data-testid="order-result"></p>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
