apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
  namespace: bloodstream
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow
  namespace: bloodstream
rules:
  - apiGroups: ["bloodstream.io"]
    resources: ["bloodstreamconfigs"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow
  namespace: bloodstream
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow
subjects:
  - kind: ServiceAccount
    name: argo-workflow
    namespace: bloodstream
