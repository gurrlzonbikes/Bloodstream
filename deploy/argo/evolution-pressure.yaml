# System evolution — increases drift pressure on dormant configurations
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: evolution-pressure
  namespace: bloodstream
  labels:
    bloodstream.io/event-type: evolution
spec:
  schedule: "0 */4 * * *"
  workflowSpec:
    entrypoint: evolve
    templates:
      - name: evolve
        container:
          image: curlimages/curl:8.12.1
          command: [sh, -c]
          args:
            - |
              curl -sf -X POST http://demo-evolution.bloodstream-demo.svc.cluster.local:3004/evolve \
                -H 'Content-Type: application/json' \
                -d '{"steps": 1}'
              echo "evolution step applied"
