apiVersion: v1
kind: ServiceAccount
metadata:
  name: bloodstream-operator
  namespace: bloodstream
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bloodstream-operator
rules:
  - apiGroups: ["bloodstream.io"]
    resources: ["bloodstreamconfigs", "bloodstreampaths", "bloodstreamconfigs/status", "bloodstreampaths/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bloodstream-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bloodstream-operator
subjects:
  - kind: ServiceAccount
    name: bloodstream-operator
    namespace: bloodstream
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bloodstream-operator
  namespace: bloodstream
spec:
  replicas: 1
  selector:
    matchLabels: { app: bloodstream-operator }
  template:
    metadata:
      labels: { app: bloodstream-operator }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: bloodstream-operator
      containers:
        - name: operator
          image: bloodstream/operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: execution-api, containerPort: 9091 }
          env:
            - name: BLOODSTREAM_NAMESPACE
              value: bloodstream
            - name: EVOLUTION_URL
              value: http://demo-evolution.bloodstream-demo.svc.cluster.local:3004
---
apiVersion: v1
kind: Service
metadata:
  name: bloodstream-operator
  namespace: bloodstream
  labels:
    app: bloodstream-operator
spec:
  selector: { app: bloodstream-operator }
  ports:
    - { name: metrics, port: 8080, targetPort: 8080 }
    - { name: execution-api, port: 9091, targetPort: 9091 }
