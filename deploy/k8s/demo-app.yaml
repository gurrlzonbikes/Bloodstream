apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-frontend
  namespace: bloodstream-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-frontend }
  template:
    metadata:
      labels: { app: demo-frontend }
    spec:
      containers:
        - name: frontend
          image: bloodstream/demo-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: AUTH_URL, value: "http://demo-auth:3001" }
            - { name: PAYMENTS_URL, value: "http://demo-payments:3002" }
            - { name: FLAGS_URL, value: "http://demo-feature-flags:3003" }
            - { name: EVOLUTION_URL, value: "http://demo-evolution:3004" }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-frontend
  namespace: bloodstream-demo
spec:
  selector: { app: demo-frontend }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-auth
  namespace: bloodstream-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-auth }
  template:
    metadata:
      labels: { app: demo-auth }
    spec:
      containers:
        - name: auth
          image: bloodstream/demo-service:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "services/auth/server.js"]
          ports: [{ containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - { name: EVOLUTION_URL, value: "http://demo-evolution:3004" }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-auth
  namespace: bloodstream-demo
spec:
  selector: { app: demo-auth }
  ports: [{ port: 3001, targetPort: 3001 }]
---
