# Low-frequency satellite circulation configurations
apiVersion: bloodstream.io/v1
kind: BloodstreamConfig
metadata:
  name: safari
  namespace: bloodstream
spec:
  browser: webkit
  trafficClass: satellite
  circulation:
    minimumRunsPerWeek: 2
    dormancyThresholdHours: 72
  vitality:
    targetScore: 0.7
---
