apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: bloodstream
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: bloodstream
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: bloodstream
        orgId: 1
        folder: Bloodstream
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-bloodstream
  namespace: bloodstream
binaryData: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: bloodstream
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: bloodstream }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboards-provider
          configMap: { name: grafana-dashboards-provider }
        - name: dashboards
          configMap: { name: grafana-dashboard-bloodstream }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: bloodstream
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
