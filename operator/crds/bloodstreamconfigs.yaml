apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bloodstreamconfigs.bloodstream.io
spec:
  group: bloodstream.io
  names:
    kind: BloodstreamConfig
    listKind: BloodstreamConfigList
    plural: bloodstreamconfigs
    singular: bloodstreamconfig
    shortNames:
      - bsconfig
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                browser:
                  type: string
                networkProfile:
                  type: string
                featureFlagProfile:
                  type: string
                env:
                  type: string
                trafficClass:
                  type: string
                  enum: [corridor, satellite]
                circulation:
                  type: object
                  properties:
                    minimumRunsPerWeek:
                      type: integer
                    dormancyThresholdHours:
                      type: number
                vitality:
                  type: object
                  properties:
                    targetScore:
                      type: number
              required: [browser, trafficClass]
            status:
              type: object
              properties:
                vitalityScore:
                  type: number
                dormancyPressure:
                  type: number
                executionDensity:
                  type: number
                driftPressure:
                  type: number
                driftScore:
                  type: number
                flakePressure:
                  type: number
                congestionScore:
                  type: number
                lastReconciliation:
                  type: string
                  format: date-time
                lastExecution:
                  type: string
                  format: date-time
                executionCount7d:
                  type: integer
                phase:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.trafficClass
        - name: Vitality
          type: number
          jsonPath: .status.vitalityScore
        - name: Drift
          type: number
          jsonPath: .status.driftScore
        - name: Phase
          type: string
          jsonPath: .status.phase
